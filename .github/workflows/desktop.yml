name: Desktop

# Builds the Tauri desktop installers for macOS (Apple Silicon + Intel),
# Linux, and Windows. Runs on desktop-v* tags (attaching the installers to a
# GitHub Release) and on manual dispatch (artifacts only).
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Dummy value so the server config validates during the staged web build;
  # the real secret is generated per-machine by the desktop shell at runtime.
  SPECPASA_SECRET: ci-only-dummy-secret-0123456789abcdef

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            name: macos-aarch64
          - os: macos-15-intel # last Intel macOS runner image
            name: macos-x86_64
          - os: ubuntu-22.04 # oldest supported image → widest glibc compat for AppImage/deb
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux webview and bundler dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - run: pnpm install --frozen-lockfile

      # Stages the production web server into src-tauri/resources/server,
      # then runs `tauri build` (bundle targets filtered per platform).
      - run: pnpm --filter @specpasa/desktop build

      - uses: actions/upload-artifact@v4
        with:
          name: specpasa-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
